:root{--bg:#f5f7fb;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--accent-soft:#dbeafe}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
h1{margin:0 0 8px;font-size:28px}
.sub{color:var(--muted);margin-bottom:24px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.field{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
select,input,button{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;margin-top:10px}
.subject-box{background:#eef2ff;border:1px solid #c7d2fe;padding:10px;border-radius:10px;font-weight:700;color:#1e3a8a}
.preview{white-space:pre-wrap;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:760px;}
.edit-token{background:#fef3c7; cursor:text;} .remove-token{background:#fee2e2; cursor:text;}
.remove-token{background:#fee2e2}
.footer{font-style:italic;color:#444}
</style>
</head>

<h1>📧 STAR Email Template Picker</h1>

<select id="region"></select>

<label>Template</label>
<select id="templateType"></select>

<label>Language</label>
<select id="language">
<option value="ENG">ENG</option>
<option value="ESP">ESP</option>
</select>

<label>Pick First Email Date</label>
<input type="date" id="baseDate">

<label>Auto +30 Days</label>
<input type="text" id="plusDate" readonly>

<button id="copyBtn">Copy email</button>
<button id="resetBtn" type="button" style="background:#9ca3af;">Reset</button>
</div>

<div class="card">
<div id="preview" class="preview" contenteditable="true"></div>
</div>

var regionOptions = ['UK','AUS','NZL','CAN','SGP','EU','US'];
var templateOptions = [
 { value: 'first_contact', label: 'First contact' },
 { value: 'confirmation', label: 'Thank you/ Confirmation' },
 { value: 'followup_7', label: 'Follow-up 7d' },
 { value: 'followup_14', label: 'Follow-up 14d' },
 { value: 'followup_21', label: 'Follow-up 21d' },
 { value: 'followup_28', label: 'Follow-up 28d' },
 { value: 'incorrect_submission', label: 'Incorrect submission' },
 { value: 'additional_questions', label: 'Additional questions' },
 { value: 'security_privacy', label: 'Security privacy' },
 { value: 'suspension', label: 'Suspension' }
];

var regionEl=document.getElementById('region');
var templateTypeEl=document.getElementById('templateType');
var languageEl=document.getElementById('language');
var previewEl=document.getElementById('preview');
var baseDate=document.getElementById('baseDate');
var plusDate=document.getElementById('plusDate');

regionOptions.forEach(r=>{
 let o=document.createElement('option'); o.value=r; o.textContent=r; regionEl.appendChild(o);
});

templateOptions.forEach(t=>{
 let o=document.createElement('option'); o.value=t.value; o.textContent=t.label; templateTypeEl.appendChild(o);
});

function highlight(text){
  // normalize greeting safely
  text = text.replace(/Hello[^\n]*/g,'Hello {{{Recipient.FirstName}}},');;

  // highlight [] tokens
  text = text.replace(/\[[^\]]+\]/g,function(match){
    var lower = match.toLowerCase();
    if(lower.includes('delete') || lower.includes('copy and paste') || lower.includes('if appropriate') || lower.includes('choose')){
      return '<span class="remove-token">'+match+'</span>';
    }
    return '<span class="edit-token">'+match+'</span>';
  });

  // highlight {{{ }}}
  text = text.replace(/\{\{\{[^}]+\}\}\}/g,function(m){
    return '<span class="edit-token">'+m+'</span>';
  });

  // highlight (customers name)
  text = text.replace(/\(customers name\)/gi,'<span class="edit-token">(customers name)</span>');

  
  // highlight date placeholder (ALL variants)
text = text.replace(/\(\s*1st email(?:\s*day)?\s*\+\s*21\s*days?\s*\)/gi, function(m){
  return '<span class="edit-token">' + m + '</span>';
});

  return text.split("\n").join("<br>");
}

function render(){
 var body = templates[templateTypeEl.value][languageEl.value];
 var footer = footers[regionEl.value];
 previewEl.innerHTML = highlight(body) + "<br><br><span class='footer'>" + footer + "</span>";

 // add click-to-clear behavior for tokens
 setTimeout(function(){
   previewEl.querySelectorAll('.edit-token, .remove-token').forEach(function(el){
     el.addEventListener('click', function(e){
       e.stopPropagation();
       if(!el.dataset.cleared){
         el.textContent = '';
         el.dataset.cleared = 'true';
       }
       // place caret inside token for typing
       const range = document.createRange();
       const sel = window.getSelection();
       range.selectNodeContents(el);
       range.collapse(false);
       sel.removeAllRanges();
       sel.addRange(range);
       el.focus();
     });
   });
 },0);
}

baseDate.addEventListener('change',function(){
 if(!baseDate.value) return;
 let d=new Date(baseDate.value);
 d.setDate(d.getDate()+30);

 // format: Month Day, Year
 const options = { year: 'numeric', month: 'long', day: 'numeric' };
 plusDate.value = d.toLocaleDateString('en-US', options);
});

document.getElementById('copyBtn').onclick=function(){
 // validation: check if tokens still exist
 const hasUnedited = previewEl.querySelectorAll('.edit-token:not([data-cleared]), .remove-token:not([data-cleared])').length > 0;

 if(hasUnedited){
   alert('Warning: Some required sections are still not edited. Please review all highlighted areas before copying.');
   return;
 }

 navigator.clipboard.writeText(previewEl.innerText);
};

// subject click-to-copy
document.getElementById('subjectBox').onclick=function(){
 navigator.clipboard.writeText(this.textContent.trim());
};

regionEl.onchange=render;
templateTypeEl.onchange=render;
languageEl.onchange=render;

regionEl.value='US';
templateTypeEl.value='first_contact';
languageEl.value='ENG';

render();

// block Ctrl+A inside preview
previewEl.addEventListener('keydown', function(e){
 if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a'){
   e.preventDefault();
 }
});





// reset button logic
document.getElementById('resetBtn').onclick = function(){
  regionEl.value = 'US';
  templateTypeEl.value = 'first_contact';
  languageEl.value = 'ENG';
  baseDate.value = '';
  plusDate.value = '';
  render();
};
